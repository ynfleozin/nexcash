spring.application.name=nexcash

# Conexão PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexcash}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:senha}

# Configurações JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# 4. Configuração do Firebase JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/nexcash-6ad53